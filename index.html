<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harp</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Camada que escurece o que esta atras da janela. A opacidade do usuario
         mexe aqui: animar CSS nao pisca. -->
    <div class="gp-backdrop" id="backdrop"></div>

    <!-- Estilo Aura: a cor de destaque acesa por dentro da borda. So existe no CSS desse
         estilo; nos outros, e uma camada vazia que nao pinta nada. -->
    <div class="gp-aura" aria-hidden="true"></div>

    <div class="gp-shell">
      <!-- Topo: abas a esquerda e o resto da faixa serve para arrastar, o que
           aproveita um espaco que ja existia. As pontas ficam livres para as
           alcas de redimensionamento. -->
      <div class="gp-topbar">
        <span class="gp-tabs" id="tabs"></span>
        <div class="gp-topbar__drag" data-drag data-i18n-title="window.drag"></div>
      </div>

      <!-- Controles que so aparecem quando o mouse chega perto. -->
      <div class="gp-controls" id="controls">
        <!-- Alca de arraste: sem barra de titulo, nada mais indica que a janela
             pode ser movida. Arrastar por aqui e pela faixa do topo funciona igual. -->
        <div class="gp-btn gp-btn--grip" data-drag data-i18n-title="window.drag" data-i18n-aria="window.move">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="6" r="1.4" /><circle cx="15" cy="6" r="1.4" />
            <circle cx="9" cy="12" r="1.4" /><circle cx="15" cy="12" r="1.4" />
            <circle cx="9" cy="18" r="1.4" /><circle cx="15" cy="18" r="1.4" />
          </svg>
        </div>
        <button class="gp-btn" id="btn-minimize" data-i18n-title="window.minimize" data-i18n-aria="window.minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <button class="gp-btn gp-btn--danger" id="btn-close" data-i18n-title="window.close" data-i18n-aria="window.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <main class="gp-editor-wrap">
        <div id="editor" class="gp-editor"></div>
      </main>

      <footer class="gp-status" id="status" data-drag>
        <div class="gp-status__group">
          <button class="gp-chip" id="chip-ontop" data-active="true" data-i18n-title="chip.onTop.title">
            <span class="gp-chip__dot"></span><span class="gp-chip__label" data-i18n="chip.onTop"></span>
          </button>
          <button class="gp-chip" id="chip-ghost" data-i18n-title="chip.ghost.title">
            <span class="gp-chip__dot"></span><span class="gp-chip__label" data-i18n="chip.ghost"></span>
          </button>
          <button class="gp-chip" id="chip-stealth" data-i18n-title="chip.stealth.title">
            <span class="gp-chip__dot"></span><span class="gp-chip__label" data-i18n="chip.stealth"></span>
          </button>

        </div>

        <div class="gp-status__group gp-status__group--right">
          <span class="gp-metrics" id="metrics"></span>
          <!-- Opacidade com menos e mais, como o tamanho do texto. O numero
               continua sendo o botao do esmaecer automatico (o ponto ao lado). -->
          <span class="gp-stepper" id="opacity-control">
            <button class="gp-fontsize__btn gp-stepper__step" id="opacity-less" data-i18n-title="chip.opacity.less">−</button>
            <button class="gp-metric gp-metric--dim" id="metric-opacity" data-i18n-title="chip.opacity.title">90%</button>
            <button class="gp-fontsize__btn gp-stepper__step" id="opacity-more" data-i18n-title="chip.opacity.more">+</button>
          </span>
          <span class="gp-barprompter" id="bar-prompter">
            <button class="gp-barprompter__btn" data-bar-prompter="play" data-i18n-title="prompter.start">▶</button>
            <button class="gp-barprompter__btn" data-bar-prompter="slower" data-i18n-title="prompter.slower">−</button>
            <span class="gp-barprompter__speed" id="bar-prompter-speed">10</span>
            <button class="gp-barprompter__btn" data-bar-prompter="faster" data-i18n-title="prompter.faster">+</button>
            <button class="gp-barprompter__btn" data-bar-prompter="notch" data-i18n-title="prompter.notch">▭</button>
            <button class="gp-barprompter__btn" data-bar-prompter="stage" data-i18n-title="prompter.stage">⛶</button>
          </span>
          <span class="gp-fontsize" id="fontsize">
            <button class="gp-fontsize__btn" id="font-smaller" data-i18n-title="chip.fontSize.smaller">A−</button>
            <span class="gp-fontsize__value" id="font-size-value">15</span>
            <button class="gp-fontsize__btn" id="font-bigger" data-i18n-title="chip.fontSize.bigger">A+</button>
          </span>
          <!-- So existe quando ha rascunhos: sem eles, nao ha o que acessar. -->
          <button class="gp-chip gp-chip--drafts" id="chip-drafts" data-i18n-title="drafts.chip" hidden>
            <span class="gp-chip__glyph" id="drafts-glyph"></span><span id="drafts-count">0</span>
          </button>
          <!-- Icones desenhados, e nao caracteres: o "⋯" ficava tao pequeno que as
               tres bolinhas viravam uma linha, e a engrenagem cheia perdia
               contraste sobre fundo escuro. -->
          <button class="gp-chip gp-chip--icon" id="chip-modules" data-i18n-title="chip.modules.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"/></svg></button>
          <!-- O ponto e todo o aviso de versao nova que existe fora das
               configuracoes: quem estiver escrevendo pode ignora-lo por dias. -->
          <button class="gp-chip gp-chip--icon" id="chip-settings" data-i18n-title="chip.settings.title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg><span class="gp-badge" id="update-dot" hidden></span>
          </button>
          <button class="gp-chip gp-chip--icon" id="chip-help" data-i18n-title="chip.help.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/></svg></button>
        </div>
      </footer>
    </div>

    <!-- Marca o ponto de leitura no teleprompter. -->
    <div class="gp-focusline" aria-hidden="true"></div>

    <!-- Controles do teleprompter: aparecem ao aproximar o mouse. Existem porque
         ninguem deve ficar preso num modo por nao ter decorado um atalho. -->
    <div class="gp-prompter" id="prompter" hidden>
      <button class="gp-prompter__btn" data-prompter="pause" data-i18n-title="prompter.playPause">
        <span id="prompter-play">▶</span>
      </button>
      <span class="gp-prompter__speed" id="prompter-speed">25</span>
      <button class="gp-prompter__btn gp-prompter__btn--extra" data-prompter="slower" data-i18n-title="prompter.slower">−</button>
      <button class="gp-prompter__btn gp-prompter__btn--extra" data-prompter="faster" data-i18n-title="prompter.faster">+</button>
      <button class="gp-prompter__btn gp-prompter__btn--extra gp-prompter__btn--exit" data-prompter="exit" data-i18n-title="prompter.exit">✕</button>
    </div>

    <!-- Historico de versoes (Ctrl+Shift+V). Conteudo em src/ui/history.ts. -->
    <div class="gp-sheet" id="history" hidden></div>

    <!-- Menu de modulos da barra. Conteudo gerado em src/main.ts. -->
    <div class="gp-menu" id="modules" hidden></div>

    <!-- Seletor de icone da aba. Conteudo em src/ui/icon-picker.ts. -->
    <div class="gp-menu gp-picker" id="icon-picker" role="dialog" hidden></div>

    <!-- Rascunhos recentes (Ctrl+J). Conteudo em src/ui/drafts.ts. -->
    <div class="gp-sheet" id="drafts" hidden></div>

    <!-- Configuracoes (Ctrl+,). Conteudo em src/ui/settings.ts. -->
    <div class="gp-sheet" id="settings" hidden></div>

    <!-- Painel de atalhos (Ctrl+/). Conteudo gerado em src/ui/shortcuts.ts. -->
    <div class="gp-sheet" id="shortcuts" hidden></div>

    <!-- Alcas de redimensionamento. A borda nativa de uma janela sem moldura tem
         poucos pixels; estas ampliam a area sem mudar a aparencia. -->
    <div class="gp-resize gp-resize--n" data-resize="North"></div>
    <div class="gp-resize gp-resize--s" data-resize="South"></div>
    <div class="gp-resize gp-resize--e" data-resize="East"></div>
    <div class="gp-resize gp-resize--w" data-resize="West"></div>
    <div class="gp-resize gp-resize--nw" data-resize="NorthWest"></div>
    <div class="gp-resize gp-resize--ne" data-resize="NorthEast"></div>
    <div class="gp-resize gp-resize--sw" data-resize="SouthWest"></div>
    <div class="gp-resize gp-resize--se" data-resize="SouthEast"></div>

    <!-- Avisos efemeros. Existe porque alguns estados (invisivel em gravacao,
         modo fantasma) sao invisiveis por natureza e precisam de confirmacao. -->
    <div class="gp-toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
